name: bench

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  deployments: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bench:
    name: criterion regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Run criterion benches
        # `--output-format bencher` makes criterion print one
        # `test … bench: N ns/iter (+/- M)` line per measurement, which
        # github-action-benchmark parses with `tool: 'cargo'`.
        #
        # target/criterion is wiped first because it arrives via
        # rust-cache, which keys on Cargo.lock. Any dependency bump
        # invalidates that key and leaves criterion with a partial
        # baseline, whereupon it prints
        #   test NAME ... Criterion.rs ERROR: Failed to access file ".../base/sample.json"
        # splitting the one-line bencher record in two. The parser then
        # reports "No benchmark result was found" and the job fails —
        # and with CACHE_ON_FAILURE=false it never saves a cache, so
        # every later run misses too and it cannot recover on its own.
        # The dashboard's history lives in gh-pages, not here, so
        # starting criterion clean costs nothing.
        run: |
          rm -rf target/criterion
          cargo bench -p recast-core --features lang-rust,script --bench engine -- \
            --output-format bencher | tee bench-output.txt
          grep -qE '^test .+ \.\.\. bench:' bench-output.txt \
            || { echo "::error::bench-output.txt has no parseable bencher lines"; exit 1; }

      - name: Store / compare against baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: recast-core engine benches
          tool: 'cargo'
          output-file-path: bench-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push the new baseline to gh-pages only on main; PRs just
          # compare and comment.
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Fail the PR if any benchmark slows by >50%. Tune up
          # (stricter) once a stable baseline accumulates.
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
          summary-always: true
          # Keep the last 100 runs visible in the dashboard.
          max-items-in-chart: 100
